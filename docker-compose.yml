version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: series_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: series_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: series_backend
    environment:
      NODE_ENV: development
      PORT: 5001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: series_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      # LLM Configuration (Ollama running on host)
      LLM_PROVIDER: ${LLM_PROVIDER:-llama}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434}
      LLM_MODEL: ${LLM_MODEL:-llama3.2}
    ports:
      - "5001:5001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    # Migration runs automatically via start.sh script

  kafka-ingestor:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: series_kafka_ingestor
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: series_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      # Kafka configuration - set these in your .env or override here
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-plain}
      KAFKA_TLS_ENABLED: ${KAFKA_TLS_ENABLED:-true}
      KAFKA_FROM_BEGINNING: ${KAFKA_FROM_BEGINNING:-false}
      # Series API configuration
      SERIES_API_BASE: ${SERIES_API_BASE:-}
      SERIES_API_KEY: ${SERIES_API_KEY:-}
      SENDER_NUMBER: ${SENDER_NUMBER:-}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    command: npm run kafka:ingest
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: series_frontend
    environment:
      VITE_API_URL: http://localhost:5001
      VITE_API_PROXY_TARGET: http://backend:5001
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
